function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.leaf}</svg>`;}
function fillIcons(){document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon);el.removeAttribute('data-icon');});}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const $ = (s,root=document)=>root.querySelector(s);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const uid=()=>crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
function clone(x){return JSON.parse(JSON.stringify(x));}
function safePhoto(s){return typeof s==='string'&&s.length<1500000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s)?s:'';}
function parts(date=new Date()){return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(date)).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));}
function dateKey(date=new Date()){const p=parts(date);return `${p.year}-${p.month}-${p.day}`;}
function dayNumber(date){return Date.parse(dateKey(date)+'T12:00:00Z')/DAY;}
function dateLabel(d,withYear=false){if(!d)return 'Not recorded';return new Intl.DateTimeFormat('en-US',{timeZone:TZ,month:'short',day:'numeric',...(withYear?{year:'numeric'}:{})}).format(new Date(d));}
function timeLabel(d){return new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}).format(new Date(d));}
function relative(d){if(!d)return 'Not recorded';const n=Math.round(dayNumber(new Date())-dayNumber(d));return n===0?'Today':n===1?'Yesterday':n<0?`In ${-n} days`:`${n} days ago`;}
function dateOnlyISO(day){return new Date(day+'T12:00:00-08:00').toISOString();}
function localInput(d=new Date()){const p=parts(d);return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;}
function fromLocalInput(value){if(!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(value))throw Error('Choose a valid date and time.');const [date,time]=value.split('T'),[y,m,d]=date.split('-').map(Number),[h,min]=time.split(':').map(Number);const target=Date.UTC(y,m-1,d,h,min);let guess=target;for(let i=0;i<3;i++){const p=parts(new Date(guess)),seen=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);guess+=target-seen;}if(localInput(new Date(guess))!==value)throw Error('That Portland time does not exist because of the daylight-saving change. Choose another time.');if(guess>Date.now()+300000)throw Error('Logs describe completed care. Choose now or a date in the past.');return new Date(guess).toISOString();}
function shiftDay(key,n){return new Date(Date.parse(key+'T12:00:00Z')+n*DAY).toISOString().slice(0,10);}
function dueLabel(d){const n=Math.round(dayNumber(d)-dayNumber(new Date()));return n<=0?'Check soil today':n===1?'Next check tomorrow':`Check again ${dateLabel(d)}`;}
function seasonInfo(date=new Date()){const p=parts(date),month=+p.month;const low=[10,11,12,1,2].includes(month);const name=month===11?'Late fall':month===10?'Fall':month===12||month<=2?'Winter':month<=5?'Spring':month<=8?'Summer':'Early fall';return {name,low,month,title:low?'A slower season.':'A growing season.',desc:low?'Shorter days, a gentler pace. Let the soil, not the calendar, decide when to water.':'Longer days can change the rhythm. Check the soil as light and growth pick up.'};}
function lightLabel(v){return ({verylow:'Very low light',low:'Low light',medium:'Moderate indirect light',bright:'Bright indirect light',grow:'Grow light'})[v]||'Unknown light';}
function dayLength(date=new Date()){const y=+parts(date).year;const n=(Date.parse(dateKey(date)+'T12:00:00Z')-Date.UTC(y,0,0,12))/DAY;const dec=23.44*Math.PI/180*Math.sin(2*Math.PI*(284+n)/365);const lat=45.5152*Math.PI/180;const cosH=(Math.sin(-.833*Math.PI/180)-Math.sin(lat)*Math.sin(dec))/(Math.cos(lat)*Math.cos(dec));return 24/Math.PI*Math.acos(clamp(cosH,-1,1));}
const SPECIES={monstera:{name:'Monstera deliciosa',label:'Monstera',care:'Check the upper 2-3 inches of mix. Let this layer dry between waterings, and make sure excess water can drain.',base:5,source:'https://homegarden.cahnr.uconn.edu/factsheets/monstera-deliciosa/'},pothos:{name:'Epipremnum aureum',label:'Golden pothos',care:'Allow the potting mix to dry moderately between waterings. Check below the surface rather than relying only on the calendar.',base:5,source:'https://extension.illinois.edu/houseplants/pothos'},mystery:{name:'Species not yet identified',label:'Mystery plant',care:'Identify this plant before relying on species-specific advice. Assess moisture below the surface of the large pot; a dry surface alone is not a watering instruction.',base:3},other:{name:'Custom plant',label:'Another plant',care:'Add species-specific care notes to this profile. The check reminder is only a prompt to observe the plant and its soil.',base:4}};
const EVENT_LABELS={water:'Watered',water_fertilize:'Watered + fertilized',moisture:'Soil check',fertilize:'Fertilized',repot:'Repotted',health:'Health observation',note:'Note',snooze:'Check snoozed'};
const EVENT_ICONS={water:'water',water_fertilize:'water',moisture:'soil',fertilize:'sprout',repot:'pot',health:'heart',note:'note',snooze:'bell'};
let db,records=new Map(),scope='local',config=null,session=null,syncBusy=false,syncError='',lastSynced=null;
let tab='plants',historyPlant='',historyType='',historyDay='',historyLimit=100,monthCursor=dateKey().slice(0,7),toastTimer,undoAction=null,saveTimer;
let modalContext=null,channel=null,authWorking=false,lastDate=dateKey(),storageReady=false;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const d=req.result;const r=d.createObjectStore('records',{keyPath:['scope','id']});r.createIndex('scope','scope');d.createObjectStore('meta',{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('Close other Tend tabs and reload to finish opening storage.'));});}
function readMeta(key){return new Promise((resolve,reject)=>{const q=db.transaction('meta').objectStore('meta').get(key);q.onsuccess=()=>resolve(q.result?.value??null);q.onerror=()=>reject(q.error);});}
function writeMeta(key,value){return new Promise((resolve,reject)=>{const t=db.transaction('meta','readwrite');t.objectStore('meta').put({key,value});t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('Storage write was interrupted.'));});}
function readScope(s){return new Promise((resolve,reject)=>{const q=db.transaction('records').objectStore('records').index('scope').getAll(s);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});}
function writeRows(rows){return new Promise((resolve,reject)=>{const t=db.transaction('records','readwrite');for(const row of rows)t.objectStore('records').put(row);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('Could not save. Your browser storage may be full. Export a backup before clearing anything.'));});}
async function deleteScope(s){const rows=await readScope(s);return new Promise((resolve,reject)=>{const t=db.transaction('records','readwrite');rows.forEach(r=>t.objectStore('records').delete([s,r.id]));t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
function defaultPlant(id,type,name,order){return {id,kind:'plant',payload:{name,type,customSpecies:'',location:'',potSize:type==='mystery'?'Large':'Unknown',material:'unknown',drainage:'unknown',soil:'',light:'inherit',growth:'auto',growHours:12,baseDays:SPECIES[type].base,notes:'',photo:'',order,archived:false,fertilizerEnabled:false,fertDays:30,fertProduct:'',fertDose:'',resetAt:null},deleted:false,client_updated_at:EPOCH,dirty:true};}
function defaultRows(){return [defaultPlant('plant-monstera','monstera','Monstera',1),defaultPlant('plant-pothos','pothos','Golden pothos',2),defaultPlant('plant-mystery','mystery','Mystery plant',3),{id:'home',kind:'settings',payload:{light:'verylow',seasonMode:'auto',reminderDays:3,reminderHour:18},deleted:false,client_updated_at:EPOCH,dirty:true},{id:'vacation',kind:'settings',payload:{enabled:false,start:'',end:'',caretaker:'',notes:''},deleted:false,client_updated_at:EPOCH,dirty:true}];}
async function loadScope(s){scope=s;const list=await readScope(s);records=new Map(list.map(r=>[r.id,r]));const seeds=defaultRows().filter(r=>!records.has(r.id)).map(r=>({...r,scope:s}));if(seeds.length){await writeRows(seeds);seeds.forEach(r=>records.set(r.id,r));}lastSynced=await readMeta('lastSynced:'+s);}
const home=()=>({...defaultRows()[3].payload,...records.get('home')?.payload});
const vacation=()=>({...defaultRows()[4].payload,...records.get('vacation')?.payload});
const plant=(id)=>{const r=records.get(id);return r&&r.kind==='plant'&&!r.deleted?{...r.payload,id:r.id}:null;};
const allPlants=(archived=false)=>Array.from(records.values()).filter(r=>r.kind==='plant'&&!r.deleted&&(archived||!r.payload.archived)).map(r=>({...r.payload,id:r.id})).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name));
const events=(id)=>Array.from(records.values()).filter(r=>r.kind==='event'&&!r.deleted&&(!id||r.payload.plantId===id)).map(r=>({...r.payload,id:r.id})).sort((a,b)=>b.at.localeCompare(a.at)||b.id.localeCompare(a.id));
const waters=(id)=>events(id).filter(e=>['water','water_fertilize'].includes(e.type));
const lastEvent=(id,types)=>events(id).find(e=>types.includes(e.type));
function recordTimestamp(id){return new Date(Math.max(Date.now(),Date.parse(records.get(id)?.client_updated_at||EPOCH)+1)).toISOString();}
async function commitUnlocked(changes,{undo=false,message='Saved'}={}){if(!storageReady)throw Error('Browser storage is unavailable. Do not log care until storage works.');const old=changes.map(c=>records.has(c.id)?clone(records.get(c.id)):null);const rows=changes.map(c=>({...c,scope,client_updated_at:recordTimestamp(c.id),dirty:true,deleted:!!c.deleted}));await writeRows(rows);rows.forEach(r=>records.set(r.id,r));if(channel)channel.postMessage({type:'changed',scope});if(undo){const savedScope=scope;undoAction=async()=>{if(scope!==savedScope)throw Error('Return to the original account before undoing.');await commit(old.map((r,i)=>r?{id:r.id,kind:r.kind,payload:r.payload,deleted:r.deleted}:{id:rows[i].id,kind:rows[i].kind,payload:{},deleted:true}),{message:'Undone'});};}else undoAction=null;if(message)toast(message,false,undo);render();scheduleSync();return rows;}
async function saveEvent(payload,{undo=true,message='Saved'}={}){return commit([{id:uid(),kind:'event',payload,deleted:false}],{undo,message});}
function environment(p,date=new Date()){const h=home(),light=p.light==='inherit'?h.light:p.light;const seasonalLow=h.seasonMode==='low'||(h.seasonMode==='auto'&&seasonInfo(date).low);const low=p.growth==='no'||(light!=='grow'&&p.growth!=='yes'&&seasonalLow);let factor=light==='verylow'?1.25:light==='low'?1.12:light==='bright'?0.85:light==='grow'?0.85:1;factor*=low?1.2:1;return {light,low,factor};}
function learning(p){const es=events(p.id).filter(e=>!p.resetAt||e.at>=p.resetAt).sort((a,b)=>a.at.localeCompare(b.at));const current=environment(p),samples=[];let water=null,found=false;for(const e of es){if(['water','water_fertilize'].includes(e.type)){water=e;found=false;}else if(e.type==='moisture'&&e.moisture==='dry'&&water&&!found){const days=(Date.parse(e.at)-Date.parse(water.at))/DAY;const context=water.environment||environment(p,new Date(water.at));if(days>=.5&&days<=90&&context.light===current.light&&context.low===current.low)samples.push(days);found=true;}}return samples.slice(-8);}
function recommendation(p){const env=environment(p),lastWater=waters(p.id)[0],lastSoil=lastEvent(p.id,['moisture']);const samples=learning(p),sorted=[...samples].sort((a,b)=>a-b);let base=clamp(Math.round((p.baseDays||SPECIES[p.type]?.base||4)*env.factor),1,14);let learned=false;if(samples.length>=3){const mid=sorted.length/2;const median=sorted.length%2?sorted[Math.floor(mid)]:(sorted[mid-1]+sorted[mid])/2;base=clamp(Math.round(median*.75),1,14);learned=true;}if(p.type==='mystery')base=Math.min(base,3);const currentSoil=lastSoil&&(!lastWater||lastSoil.at>lastWater.at)?lastSoil:null;const anchor=lastWater?.at;let due=anchor?new Date(Date.parse(anchor)+base*DAY):new Date();let reason=learned?`A conservative check window based on ${samples.length} water-to-dry observations in similar light. Checks start before the observed dry point; these sparse observations do not measure the exact dry time.`:`Using your ${p.baseDays||4}-day starter check interval, adjusted for ${lightLabel(env.light).toLowerCase()}${env.low?' and your slow-growth context':''}. This is a checking heuristic, not a watering schedule.`;let title,copy,tone='';if(!lastWater&&!lastSoil){title='Start with a soil check';copy='No care history yet. A check gives us a starting point.';tone='clay';reason='There is no recorded watering or soil observation. Check first; add a past watering only if you remember it.';}else if(currentSoil){const recheck=currentSoil.moisture==='wet'?3:currentSoil.moisture==='damp'?(env.low?3:2):currentSoil.moisture==='uncertain'?1:0;due=new Date(Date.parse(currentSoil.at)+recheck*DAY);if(currentSoil.moisture==='dry'){title='Dry at last check';copy=`Recorded ${relative(currentSoil.at).toLowerCase()}. Reassess using this plant's care notes.`;tone='clay';}else{title=dueLabel(due);copy=`${currentSoil.moisture==='uncertain'?'Uncertain':capitalize(currentSoil.moisture)} at the last check. ${due<=new Date()?'Check again; it may have changed.':'No watering assumed.'}`;tone=due<=new Date()?'clay':'';}reason=`Your ${currentSoil.moisture==='uncertain'?'uncertain':currentSoil.moisture} observation on ${dateLabel(currentSoil.at)} takes priority. ${currentSoil.moisture==='dry'?'Dryness is an observation, not an automatic instruction to water.':`The next observation is suggested ${recheck} day${recheck===1?'':'s'} later.`}`;}else{title=dueLabel(due);copy=due<=new Date()?'A reminder to observe, not a deadline to water.':`Watered ${relative(anchor).toLowerCase()}. Let the soil set the pace.`;tone=due<=new Date()?'clay':'';}if(p.resetAt&&(!lastWater||lastWater.at<p.resetAt)&&(!lastSoil||lastSoil.at<p.resetAt)){due=new Date();title='Check after the change';copy='Conditions changed. Start a fresh moisture observation.';tone='clay';reason='A move, repot, or care-setting change reset the learning window. Old history is still in your journal.';}const snooze=lastEvent(p.id,['snooze']);const latestAction=[lastWater?.at,lastSoil?.at,p.resetAt].filter(Boolean).sort().pop();if(snooze&&(!latestAction||snooze.at>latestAction)&&Date.parse(snooze.until)>Date.now()){due=new Date(snooze.until);title=`Snoozed until ${dateLabel(due)}`;copy='Only the reminder is paused; care history is unchanged.';tone='';reason='You chose this reminder date. Watering or a new soil check will replace the snooze.';}return {due,title,copy,tone,reason,base,samples,learned,lastWater,lastSoil,needsCheck:due<=new Date()};}
function capitalize(s){return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
function feeding(p){if(!p.fertilizerEnabled)return {show:false,copy:'No fertilizer reminder configured.'};if(p.type==='mystery')return {show:false,copy:'Identify the plant before using a species-specific feeding plan.'};const env=environment(p);if(p.growth==='no'||(p.growth!=='yes'&&(env.low||env.light==='verylow')))return {show:false,copy:'Feeding reminders paused for reported low light / slow growth. You can still log an application.'};const last=lastEvent(p.id,['fertilize','water_fertilize']);const due=last?new Date(Date.parse(last.at)+clamp(p.fertDays||30,1,365)*DAY):new Date();return {show:due<=new Date(),copy:last?`Product-plan review ${dateLabel(due)}. Follow its label and only feed during active growth.`:'No feeding recorded. Review the product label and active growth before applying.',due};}

function art(type){const pot='<ellipse cx="120" cy="166" rx="53" ry="6" fill="#526946" opacity=".09"/><path d="M87 123h66l-9 37q-24 10-48 0Z" fill="#b98965"/><path d="M88 123h64v9H88Z" fill="#c99b77"/><path d="m102 134 4 25M136 134l-4 25" stroke="#a67553" opacity=".5" fill="none"/>';

function plantVisual(p,editable=false,number=''){const image=safePhoto(p.photo);return `<div class="plant-visual ${esc(p.type)}">${image?`<img src="${image}" alt="${esc(p.name)}">`:art(p.type)}${number?`<span class="plant-number">${number}</span>`:''}${editable?`<button class="photo-edit" data-action="edit-plant" data-id="${esc(p.id)}" aria-label="Add or change ${esc(p.name)} photo">${icon('camera',16)}</button>`:''}</div>`;}
function renderStatus(){const el=$('#sync-status');if(!el)return;let label='Saved on this device',cls='',title='Local mode: records do not yet sync. Click to set up.';if(session){const pending=Array.from(records.values()).filter(r=>r.dirty).length;if(syncBusy){label='Syncing...';}else if(syncError){label='Sync needs attention';cls='warn';title=syncError;}else if(!navigator.onLine){label=pending?'Saved here - waiting for internet':'Offline - saved here';cls='warn';}else if(pending){label=`${pending} change${pending===1?'':'s'} waiting to sync`;cls='warn';}else{label='Synced across devices';cls='live';title=lastSynced?`Last synchronized ${dateLabel(lastSynced)} at ${timeLabel(lastSynced)}. Syncs on changes and periodically while open.`:'Signed in';}}else if(config){label='Sign in to sync';}el.innerHTML=`<span class="dot ${cls}"></span>${esc(label)}`;el.title=title;}
function render(){if(!storageReady)return;document.querySelectorAll('.nav [data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#app').innerHTML=tab==='plants'?renderPlants():tab==='history'?renderHistory():renderSettings();renderStatus();fillIcons();}
function miniActivity(e){const p=plant(e.plantId);return `<div class="activity-mini"><span class="event-icon ${esc(e.type)}">${icon(EVENT_ICONS[e.type])}</span><div class="grow"><strong>${esc(p?.name||'Archived plant')} &middot; ${esc(EVENT_LABELS[e.type]||'Entry')}</strong><small>${esc(eventDetail(e)||relative(e.at))}</small></div><span class="small muted">${esc(dateLabel(e.at))}</span></div>`;}
function renderPlants(){const ps=allPlants(),s=seasonInfo(),h=home(),es=events().slice(0,3),v=vacation();const checkCount=ps.filter(p=>recommendation(p).needsCheck).length;const activeVac=v.enabled&&v.start&&v.end&&v.end>=dateKey();const hours=dayLength(),hh=Math.floor(hours),mm=Math.round((hours-hh)*60);return `<section class="hero"><div class="hero-intro"><div class="eyebrow muted">Your little corner of green &nbsp; / &nbsp; ${esc(dateLabel(new Date(),true))}</div><h1>A little care.<br>A lot of life.</h1><p class="body-copy">Less guessing, more growing. A simple rhythm for the plants that make your place feel like home.</p></div><aside class="season"><div><div class="eyebrow">Portland &middot; ${esc(s.name)}</div><h3>${h.seasonMode==='growing'?'Your growing-light rhythm.':h.seasonMode==='low'?'Keeping a slower rhythm.':s.title}</h3><p>${h.seasonMode==='growing'?'You have overridden the seasonal slowdown. Soil observations still come first.':h.seasonMode==='low'?'Low-light season is selected. Check the mix before adding any water.':s.desc}</p><div class="row wrap" style="margin-top:13px;gap:7px"><span class="tag" style="background:#f6f8ef">${icon('sun',13)} ${esc(lightLabel(h.light))}</span><span class="small muted" title="Approximate outdoor day length, not a measurement of indoor light.">~${hh}h ${mm}m daylight</span></div></div><div class="season-art"><svg viewBox="0 0 100 120" fill="none" aria-hidden="true"><circle cx="52" cy="42" r="20" fill="#d5ddb2"/><path d="M18 88h64M27 99h47M35 108h31M50 87V48m0 22c-18-1-24-13-24-22 17 0 25 8 24 22Zm0 8c1-19 11-27 26-27-1 16-10 25-26 27Z" stroke="#718664" stroke-width="1.7" stroke-linecap="round"/></svg></div></aside></section>
${activeVac?`<div class="hint vacation-banner">${icon('suitcase')}<div class="grow"><strong>${v.start<=dateKey()?'Vacation mode is active':'A trip is on the calendar'}</strong><p>${esc(dateLabel(dateOnlyISO(v.start)))} - ${esc(dateLabel(dateOnlyISO(v.end)))}. Your plants keep their own timeline while you are away.</p></div><button class="text-btn" data-action="vacation">View plan</button></div>`:''}
<div class="section-head"><div><h2>Your plants <span style="font:12px Inter,Arial,sans-serif;color:var(--muted);vertical-align:middle;margin-left:5px">/ ${ps.length.toString().padStart(2,'0')}</span></h2><p>${checkCount?`${checkCount} soil check${checkCount===1?'':'s'} suggested. No automatic watering deadlines.`:'Nothing needs a scheduled check right now.'}</p></div><button class="btn" data-action="add-plant">${icon('plus',16)} Add plant</button></div>
<div class="plant-grid">${ps.map((p,i)=>{const r=recommendation(p),f=feeding(p);return `<article class="plant-card">${plantVisual(p,true,String(i+1).padStart(2,'0'))}<div class="plant-body"><h3 class="plant-name">${esc(p.name)}</h3><div class="plant-species">${esc(p.type==='other'?p.customSpecies||'Custom plant':SPECIES[p.type]?.name)}</div><div class="plant-stats"><div><div class="stat-label">Last watered</div><div class="stat-value">${esc(relative(r.lastWater?.at))}</div></div><div><div class="stat-label">Last soil check</div><div class="stat-value">${r.lastSoil?`${esc(capitalize(r.lastSoil.moisture==='uncertain'?'Not sure':r.lastSoil.moisture))} <span class="muted" style="font-size:10px;font-weight:400">&middot; ${esc(relative(r.lastSoil.at).toLowerCase())}</span>`:'Not recorded'}</div></div></div><div class="status-line"><span class="tag ${r.tone}">${icon('soil',13)} ${esc(r.title)}</span><button class="text-btn" data-action="why" data-id="${p.id}" aria-label="Why this recommendation for ${esc(p.name)}?" style="font-size:10px">Why?</button></div><p class="status-copy">${esc(r.copy)}</p>${f.show?'<p class="small" style="color:var(--clay);margin-bottom:12px">Fertilizer plan ready for review.</p>':''}<div class="plant-actions"><button class="btn primary" data-action="water" data-id="${p.id}">${icon('water',16)} Watered now</button><button class="btn" data-action="soil" data-id="${p.id}">${icon('soil',16)} Check soil</button></div><div class="plant-foot"><button data-action="profile" data-id="${p.id}">Profile &amp; care ${icon('arrow',12)}</button><button data-action="event" data-id="${p.id}" title="Log a past watering, fertilizer, repotting, or health observation">+ Add entry</button></div></div></article>`;}).join('')}</div>${!ps.length?'<div class="panel empty">No active plants. Add a plant or restore one in Settings.</div>':''}
<div class="below-grid"><section class="panel"><div class="row between"><h3>Little moments, logged.</h3><button class="text-btn" data-action="nav" data-tab="history">View journal ${icon('arrow',13)}</button></div>${es.length?es.map(miniActivity).join(''):`<div class="empty" style="padding:23px 8px 15px"><div class="event-icon">${icon('history',22)}</div>Your story starts with the first check.<br><span class="small">No made-up watering dates. Just what you record.</span></div>`}</section><section class="panel"><div class="row" style="margin-bottom:12px"><span class="event-icon">${icon('suitcase')}</span><h3 style="margin:0">Away from your little jungle?</h3></div><p>Make a vacation plan with care notes, plant photos, and suggested check windows for whoever is looking after things.</p><div class="button-row"><button class="btn soft" data-action="vacation">${icon('calendar',16)} Plan time away</button></div><p class="note">No "water everything before you leave" rule. Just thoughtful checks.</p></section></div>${!session?`<div class="hint" style="margin-top:23px">${icon('cloud')}<div class="grow"><strong>One home, two screens.</strong><p>Your records are saved in this browser. Connect your own cloud account to see the same journal on your phone and laptop.</p></div><button class="text-btn" data-action="connection">Set up sync</button></div>`:''}`;}
function eventDetail(e){if(e.type==='moisture')return `${e.moisture==='uncertain'?'Not sure':capitalize(e.moisture)}${e.method?' - '+e.method:''}${e.depth?' / '+e.depth:''}`;if(['fertilize','water_fertilize'].includes(e.type))return [e.product,e.dose].filter(Boolean).join(' - ')||'Application recorded';if(e.type==='repot')return [e.potSize?`Pot: ${e.potSize}`:'',e.soil].filter(Boolean).join(' - ');if(e.type==='health')return e.observation||'Observation recorded';if(e.type==='snooze')return 'Until '+dateLabel(e.until);if(e.type==='water')return [e.amount,e.method].filter(Boolean).join(' - ');return '';}
function calendarHTML(){const [year,month]=monthCursor.split('-').map(Number),first=new Date(Date.UTC(year,month-1,1)),count=new Date(Date.UTC(year,month,0)).getUTCDate();const occupied=new Set(events(historyPlant||undefined).filter(e=>!historyType||eventMatches(e,historyType)).map(e=>dateKey(e.at)));const title=new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(first);return `<div class="panel calendar"><div class="calendar-header"><button class="btn icon" data-action="month" data-step="-1" aria-label="Previous month"><span style="transform:rotate(180deg)">${icon('chevron',16)}</span></button><strong>${esc(title)}</strong><button class="btn icon" data-action="month" data-step="1" aria-label="Next month">${icon('chevron',16)}</button></div><div class="calendar-grid">${['S','M','T','W','T','F','S'].map(s=>`<span class="weekday">${s}</span>`).join('')}${Array.from({length:first.getUTCDay()},()=>'<span></span>').join('')}${Array.from({length:count},(_,i)=>{const key=monthCursor+'-'+String(i+1).padStart(2,'0');return `<button class="calendar-day ${key===dateKey()?'today':''} ${occupied.has(key)?'has-events':''} ${historyDay===key?'selected':''}" data-action="history-day" data-day="${key}" aria-label="${key}${occupied.has(key)?', entries recorded':''}" aria-pressed="${historyDay===key}">${i+1}</button>`;}).join('')}</div><p class="note">Dots mark recorded care. Tap a date to filter.</p>${historyDay?'<button class="text-btn" data-action="clear-day">Show all dates</button>':''}</div>`;}
function eventMatches(e,type){return type==='water'?['water','water_fertilize'].includes(e.type):type==='fertilize'?['fertilize','water_fertilize'].includes(e.type):e.type===type;}
function renderTimeline(list,limit=100){let previous='';return list.slice(0,limit).map(e=>{const key=dateKey(e.at),heading=key!==previous?`<h3 class="timeline-day">${esc(dateLabel(e.at,true))}</h3>`:'';previous=key;const p=plant(e.plantId),photo=safePhoto(e.photo);return `${heading}<article class="timeline-event"><div class="event-icon ${esc(e.type)}">${icon(EVENT_ICONS[e.type])}</div><div class="grow"><div class="event-title">${esc(EVENT_LABELS[e.type]||'Entry')} &middot; ${esc(p?.name||'Archived plant')}</div><span class="date">${esc(timeLabel(e.at))} &middot; Portland time</span>${eventDetail(e)?`<p>${esc(eventDetail(e))}</p>`:''}${e.notes?`<p class="muted">${esc(e.notes)}</p>`:''}${photo?`<img src="${photo}" class="thumb" alt="${esc(e.observation||'Plant journal photo')}" data-action="photo" data-id="${e.id}" tabindex="0" role="button">`:''}</div><button class="btn icon" data-action="edit-event" data-id="${e.id}" aria-label="Edit ${esc(EVENT_LABELS[e.type])} entry">${icon('edit',15)}</button></article>`;}).join('');}
function renderHistory(){const ps=allPlants(true);const filtered=events().filter(e=>(!historyPlant||e.plantId===historyPlant)&&(!historyType||eventMatches(e,historyType))&&(!historyDay||dateKey(e.at)===historyDay));const all=events(historyPlant||undefined),month=all.filter(e=>dateKey(e.at).startsWith(monthCursor));return `<div class="page-heading"><div class="eyebrow muted" style="margin-bottom:10px">The record of a growing home</div><h1>Your plant journal.</h1><p class="body-copy">Watering, observations, and the small changes in between.</p></div><div class="filters"><label class="screen-reader" for="history-plant">Filter plant</label><select id="history-plant" class="control" data-change="history-plant"><option value="">All plants</option>${ps.map(p=>`<option value="${p.id}" ${historyPlant===p.id?'selected':''}>${esc(p.name)}${p.archived?' (archived)':''}</option>`).join('')}</select><label class="screen-reader" for="history-type">Filter entry type</label><select id="history-type" class="control" data-change="history-type"><option value="">All care</option>${['water','moisture','fertilize','repot','health','note','snooze'].map(t=>`<option value="${t}" ${historyType===t?'selected':''}>${EVENT_LABELS[t]}</option>`).join('')}</select><button class="btn" data-action="event">${icon('plus',16)} Add entry</button></div><div class="history-layout"><aside class="history-sidebar">${calendarHTML()}<div class="panel" style="margin-top:20px"><div class="eyebrow muted">${esc(monthCursor)} &middot; recorded care</div><div class="summary-metrics"><div><strong>${month.filter(e=>eventMatches(e,'water')).length}</strong><span>Waterings</span></div><div><strong>${month.filter(e=>e.type==='moisture').length}</strong><span>Soil checks</span></div></div><p class="note">Counts describe what you logged, not how much care was needed.</p></div></aside><section class="panel history-list">${filtered.length?renderTimeline(filtered,historyLimit):`<div class="empty"><div class="event-icon">${ico function option(value,label,current){return `<option value="${esc(value)}" ${String(value)===String(current)?'selected':''}>${esc(label)}</option>`;}

function renderSettings(){const h=home(),v=vacation(),archived=allPlants(true).filter(p=>p.archived);return `<div class="page-heading"><div class="eyebrow muted" style="margin-bottom:10px">A few things that make it yours</div><h1>Home, light &amp; little details.</h1><p class="body-copy">Portland is the home base, even when you are somewhere else.</p></div><div class="settings-layout"><div class="stack"><section class="panel"><div class="row" style="margin-bottom:18px"><span class="event-icon">${icon('sun')}</span><h3 style="margin:0">Your growing conditions</h3></div><form data-form="home"><div class="field-row"><div class="field">Home city<input value="Portland, Oregon" readonly aria-label="Home city"></div><div class="field">Time zone<input value="America/Los_Angeles" readonly aria-label="Time zone"></div></div><label class="field">Indoor light right now<select name="light">${lightOptions(h.light)}</select><small>This is your observation, not a live light measurement. Individual plant profiles can override it.</small></label><label class="field">Season setting<select name="seasonMode">${option('auto','Automatic - follow Portland seasons',h.seasonMode)}${option('low','Override - low-light / slow-growth season',h.seasonMode)}${option('growing','Override - growing conditions year-round',h.seasonMode)}</select><small>Grow lights or reported active growth can skip the seasonal slowdown. A light or season-setting change starts a fresh learning window.</small></label><button class="btn primary" type="submit">Save home settings</button></form></section>

function openSoil(id){const p=plant(id);if(!p)return;modalContext={kind:'soil',id};showModal(`Check ${p.name}`,`<p class="body-copy">${esc(SPECIES[p.type]?.care||SPECIES.other.care)}</p>${p.drainage==='no'?'<div class="hint clay">Drainage is marked as absent. Be particularly cautious about water collecting in the pot.</div>':''}<div class="moisture-options">${[['wet','Wet','Clearly wet / saturated'],['damp','Damp','Still some moisture'],['dry','Dry','Dry where I checked'],['uncertain','Not sure','Needs another look']].map(([value,title,desc])=>`<button class="moisture-btn" data-action="save-soil" data-id="${p.id}" data-value="${value}"><strong>${title}</strong><small>${desc}</small></button>`).join('')}</div><p class="note">Tap an observation to save it now. No watering is logged automatically.</p><details><summary>Optional details before saving</summary><label class="field">How / where did you check?<input id="soil-depth" maxlength="160" placeholder="e.g. finger, 2 inches down; wooden probe deeper"></label><label class="field">Note<textarea id="soil-note" maxlength="2000" placeholder="Anything worth remembering"></textarea></label></details>`);}
function openWhy(id){const p=plant(id),r=recommendation(p);showModal('Why this check?',`<span class="tag ${r.tone}">${esc(r.title)}</span><p class="body-copy" style="margin-top:16px">${esc(r.reason)}</p><div class="hint">${icon('info')}<div><strong>${r.learned?'Learning from observations':'Still learning your plant'}</strong><p>${r.samples.length} matched water-to-dry observation${r.samples.length===1?'':'s'} since the latest condition change. At least 3 are needed before observed patterns influence timing. Sparse checks cannot tell us the exact moment the soil dried.</p></div></div><p class="note">Older or different-light observations remain in your journal. Merely watering on a schedule never teaches this app that the schedule was correct.</p><div class="button-row"><button class="btn primary" data-action="soil" data-id="${p.id}">Check soil</button><button class="btn" data-action="snooze" data-id="${p.id}">Snooze reminder</button><button class="btn" data-action="edit-plant" data-id="${p.id}">Edit care settings</button></div>`);}
function openProfile(id){const p=plant(id);if(!p)return;modalContext={kind:'profile',id};const r=recommendation(p),f=feeding(p),lastFeed=lastEvent(id,['fertilize','water_fertilize']),lastRepot=lastEvent(id,['repot']);showModal(p.name,`<div class="profile-top">${plantVisual(p)}<div><div class="eyebrow muted">${esc(p.location||'Add a room or window')}</div><h2 style="margin:7px 0">${esc(p.name)}</h2><p class="small muted">${esc(p.type==='other'?p.customSpecies:SPECIES[p.type]?.name)}</p></div></div><div class="profile-metrics"><div><span>Watered</span><strong>${esc(relative(r.lastWater?.at))}</strong></div><div><span>Fertilized</span><strong>${esc(relative(lastFeed?.at))}</strong></div><div><span>Repotted</span><strong>${esc(lastRepot?dateLabel(lastRepot.at):'Not recorded')}</strong></div></div><p class="body-copy" style="white-space:pre-line">${esc(careText(p))}</p><div class="row wrap" style="gap:7px;margin:17px 0"><span class="tag">${esc(lightLabel(environment(p).light))}</span><span class="tag">${esc(p.potSize||'Unknown')} pot</span><span class="tag">Drainage: ${esc(p.drainage)}</span></div>${p.soil?`<p class="small muted">Mix: ${esc(p.soil)}</p>`:''}<div class="hint">${icon('sprout')}<div><strong>Fertilizer plan</strong><p>${esc(f.copy)}</p></div></div><div class="button-row"><button class="btn primary" data-action="event" data-id="${p.id}">Add care entry</button><button class="btn" data-action="edit-plant" data-id="${p.id}">Edit profile &amp; photo</button><button class="btn" data-action="plant-history" data-id="${p.id}">Full history</button></div><hr class="rule"><h3>Recent care</h3>${events(id).length?renderTimeline(events(id).slice(0,4)):'<p class="note">No entries yet. A first soil check is a good place to start.</p>'}`);}

250" value="${esc(p.fertDose)}" placeholder="Copy your product label; no automatic dose is assumed"></label><p class="note">Prompts pause during reported slow growth / very low light unless you mark the plant actively growing. Mystery-plant prompts stay off until its species is identified.</p></details><div class="button-row"><button class="btn primary" type="submit">${id?'Save profile':'Add plant'}</button><button class="btn" type="button" data-action="close">Cancel</button>${id?`<button class="btn danger" type="button" data-action="archive-plant" data-id="${p.id}">Archive plant</button>`:''}</div></form>`);}

label class="field">Product<input name="product" maxlength="160" value="${esc(e.product)}"></label><label class="field">Dilution / amount<input name="dose" maxlength="250" value="${esc(e.dose)}" placeholder="Record what you actually used"></label></div><div class="hint">${icon('sprout')}<p>Follow the product label and active growth. Logging an application does not mean Tend recommended it. Choose "Watered + fertilized" to count both in one entry.</p></div><div class="spacer"></div></div><div data-types="health"><label class="field">Observation<select name="observation">${['New growth','Yellowing leaves','Brown / crispy edges','Drooping','Pests seen','Root concern','Recovered / improving','Other observation'].map(x=>option(x,x,e.observation||'New growth')).join('')}</select><small>A record of what you saw, not a diagnosis.</small></label></div><div data-types="repot"><div class="field-row"><label class="field">New pot size<select name="potSize">${['Unknown','Small','Medium','Large','Extra large'].map(x=>option(x,x,e.potSize||p.potSize)).join('')}</select></label><label class="field">New pot material<select name="material">${[['unknown','Unknown'],['plastic','Plastic'],['terracotta','Unglazed terracotta'],['ceramic','Glazed ceramic'],['other','Other']].map(([v,l])=>option(v,l,e.material||p.material)).join('')}</select></label></div><label class="field">New mix<input name="soil" maxlength="250" value="${esc(e.soil||p.soil)}"></label><label class="field">Drainage<select name="drainage">${[['unknown','Not sure'],['yes','Yes'],['no','No']].map(([v,l])=>option(v,l,e.drainage||p.drainage)).join('')}</select></label><label class="check-label"><input name="updateProfile" type="checkbox" ${!old?'checked':''}> Update current profile and reset the learning window</label><p class="note">Leave this unchecked for an old repot that does not describe the current pot. Deleting a repot entry later does not reverse profile changes.</p><div class="spacer"></div></div><div data-types="snooze"><label class="field">Snooze until<input type="date" name="until" value="${e.until?dateKey(e.until):shiftDay(dateKey(),2)}"></label></div><label class="field">Notes (optional)<textarea name="notes" maxlength="4000" placeholder="Anything worth remembering">${esc(e.notes)}</textarea></label><div id="event-photo-preview">${e.photo?`<img class="photo-preview" src="${safePhoto(e.photo)}" alt="Entry photo">`:''}</div><label class="field">Photo (optional)<input type="file" accept="image/*" data-change="event-photo"></label>${e.photo?'<button class="text-btn" type="button" data-action="remove-photo">Remove photo</button>':''}<div class="button-row"><button class="btn primary" type="submit">Save entry</button><button class="btn" type="button" data-action="close">Cancel</button>${old?`<button class="btn danger" type="button" data-action="delete-event" data-id="${old.id}">Delete entry</button>`:''}</div></form>`);toggleEventFields(e.type);}
function toggleEventFields(type){document.querySelectorAll('#modal-body [data-types]').forEach(el=>el.classList.toggle('hidden',!el.dataset.types.split(' ').includes(type)));}
function openVacation(){const v=vacation();modalContext={kind:'vacation'};showModal('Away, but still cared for.',`<form data-form="vacation"><p class="body-copy" style="margin-bottom:18px">Make a plan for your plants, not a schedule to water blindly.</p><label class="check-label"><input type="checkbox" name="enabled" ${v.enabled?'checked':''}> Enable vacation plan</label><div class="spacer"></div><div class="field-row"><label class="field">Departure<input type="date" name="start" value="${esc(v.start||dateKey())}" required></label><label class="field">Return<input type="date" name="end" value="${esc(v.end||shiftDay(dateKey(),7))}" required></label></div><label class="field">Caretaker (optional)<input name="caretaker" maxlength="120" value="${esc(v.caretaker)}" placeholder="Who is looking after things?"></label><label class="field">Handoff notes<textarea name="notes" maxlength="3000" placeholder="Where supplies are, how to reach you, anything special">${esc(v.notes)}</textarea></label><div class="hint">${icon('info')}<p>Check each plant before departure. Do not water everything just because you are leaving. Print a fresh handoff after those checks so the dates are current.</p></div><div class="button-row"><button type="submit" class="btn primary">Save vacation plan</button>${v.enabled?'<button type="button" class="btn" data-action="caretaker">View caretaker summary</button>':''}</div></form>`);}
function caretakerMarkup(){const v=vacation();return `<div class="eyebrow muted">Tend &middot; Portland, Oregon</div><h1 style="margin:10px 0 15px">A little care while I am away.</h1><p><strong>${esc(v.start||'Departure not set')} - ${esc(v.end||'Return not set')}</strong>${v.caretaker?` &middot; For ${esc(v.caretaker)}`:''}</p><p>Snapshot created ${esc(dateLabel(new Date(),true))} at ${esc(timeLabel(new Date()))} Portland time. This is not a live schedule.</p>${v.notes?`<p style="white-space:pre-wrap">${esc(v.notes)}</p>`:''}<div class="hint" style="margin:18px 0">Check the soil before watering. These dates suggest an observation, never an automatic watering. Record actual care in Tend or send the owner the date and what you did. The app must be signed in to the owner's account to share a live journal; this handoff does not grant account access.</div>${allPlants().map(p=>{const r=recommendation(p),start=v.start||dateKey(),end=v.end||start;const next=clampDay(dateKey(r.due),start);let check=next>end?'No estimated check falls inside this trip; still review before departure.':`First estimated check: around ${dateLabel(dateOnlyISO(next))}. Reassess after each observation; do not repeat a fixed watering interval.`;if(!r.lastWater&&!r.lastSoil)check='Unknown care history: assess before departure and agree on check timing with the owner.';return `<section class="care-card" style="border-top:1px solid #dce1d7;padding:22px 0;break-inside:avoid">${safePhoto(p.photo)?`<img src="${safePhoto(p.photo)}" alt="${esc(p.name)}" style="width:100px;height:100px;object-fit:cover;border-radius:12px;float:right;margin:0 0 12px 15px">`:''}<h2>${esc(p.name)}</h2><p><strong>Where:</strong> ${esc(p.location||'Location not set')}</p><p><strong>Last watered:</strong> ${esc(r.lastWater?dateLabel(r.lastWater.at,true)+' at '+timeLabel(r.lastWater.at):'Unknown')}</p><p><strong>Last soil check:</strong> ${r.lastSoil?`${esc(capitalize(r.lastSoil.moisture))} &middot; ${esc(dateLabel(r.lastSoil.at,true))}`:'Unknown'}</p><p><strong>Check window:</strong> ${esc(check)}</p><p style="white-space:pre-line">${esc(careText(p))}</p><p><strong>Pot:</strong> ${esc(p.potSize)}; drainage: ${esc(p.drainage)}${p.soil?'; mix: '+esc(p.soil):''}.</p><p class="muted">Skip fertilizer and repotting unless the owner explicitly requests them. Log observations, not diagnoses.</p><div style="clear:both"></div></section>`;}).join('')}<p><strong>On return:</strong> review the caretaker's actual notes and check each plant again. Returning home is not a reason to water every pot.</p>`;}
function clampDay(a,b){return a<b?b:a;}
function showCaretaker(){showModal('The caretaker handoff',`<div class="button-row" style="margin:0 0 22px"><button class="btn primary" data-action="print-care">Print summary</button><button class="btn" data-action="download-care">Download handoff HTML</button></div>${caretakerMarkup()}`,true);}

const SETUP_SQL = "-- TEND: run this entire file once in your own Supabase SQL Editor.\n-- No passwords or secret keys belong in this file or in index.html.\n-- Safe to rerun. This does not erase existing plant records.\nbegin;\n\ncreate table if not exists public.plant_tracker_records (\n  user_id uuid not null references auth.users(id) on delete cascade,\n  id text not null check (length(id) between 1 and 100),\n  kind text not null check (kind in ('plant', 'event', 'settings')),\n  payload jsonb not null default '{}'::jsonb,\n  deleted boolean not null default false,\n  client_updated_at timestamptz not null,\n  updated_at timestamptz not null default clock_timestamp(),\n  primary key (user_id, id),\n  constraint plant_tracker_payload_size check (octet_length(payload::text) <= 2000000)\n);\n\nalter table public.plant_tracker_records enable row level security;\nrevoke all on public.plant_tracker_records from public, anon, authenticated;\ngrant select, insert, update on public.plant_tracker_records to authenticated;\n\ndrop policy if exists \"Own plant records only\" on public.plant_tracker_records;\ncreate policy \"Own plant records only\"\n  on public.plant_tracker_records for all to authenticated\n  using ((select auth.uid()) = user_id)\n  with check ((select auth.uid()) = user_id);\n\ncreate index if not exists plant_tracker_sync_index\n  on public.plant_tracker_records (user_id, updated_at, id);\n\n-- Each event is its own record. Editing the same record on two devices uses\n-- the latest client edit timestamp. Deletions sync as tombstones.\n-- SECURITY INVOKER means the same ownership policy applies inside this function.\ncreate or replace function public.plant_tracker_sync(changes jsonb)\nreturns setof public.plant_tracker_records\nlanguage plpgsql\nsecurity invoker\nset search_path = ''\nas $$\ndeclare\n  item jsonb;\nbegin\n  if auth.uid() is null then\n    raise exception 'Sign in before synchronizing';\n  end if;\n  if jsonb_typeof(changes) <> 'array' or jsonb_array_length(changes) > 100 then\n    raise exception 'Expected an array of at most 100 changes';\n  end if;\n  for item in select value from jsonb_array_elements(changes)\n  loop\n    if (item->>'client_updated_at')::timestamptz > clock_timestamp() + interval '1 day' then\n      raise exception 'Device clock is ahead. Correct it before synchronizing.';\n    end if;\n    insert into public.plant_tracker_records as existing\n      (user_id, id, kind, payload, deleted, client_updated_at, updated_at)\n    values\n      (auth.uid(), item->>'id', item->>'kind', item->'payload',\n       coalesce((item->>'deleted')::boolean, false),\n       (item->>'client_updated_at')::timestamptz, clock_timestamp())\n    on conflict (user_id, id) do update set\n      kind = excluded.kind,\n      payload = excluded.payload,\n      deleted = excluded.deleted,\n      client_updated_at = excluded.client_updated_at,\n      updated_at = clock_timestamp()\n    where excluded.client_updated_at >= existing.client_updated_at;\n  end loop;\n  return query\n    select r.* from public.plant_tracker_records r\n    where r.user_id = auth.uid()\n      and r.id in (select value->>'id' from jsonb_array_elements(changes));\nend;\n$$;\n\nrevoke all on function public.plant_tracker_sync(jsonb) from public, anon;\ngrant execute on function public.plant_tracker_sync(jsonb) to authenticated;\n\ncommit;\n";
let recordQueue=Promise.resolve();
function recordLock(fn){const next=recordQueue.then(fn,fn);recordQueue=next.catch(()=>{});return next;}
function commit(changes,options={}){return recordLock(()=>commitUnlocked(changes,options));}
function rerenderSafe(){if(tab!=='settings')render();else renderStatus();}
function validateConfig(value){if(!value||typeof value.url!=='string'||typeof value.key!=='string')throw Error('Enter your project URL and publishable key.');let u;try{u=new URL(value.url.trim());}catch{throw Error('The project URL should look like https://your-project.supabase.co');}if(u.protocol!=='https:'||!/^[a-z0-9-]+\.supabase\.co$/.test(u.hostname)||u.username||u.password||u.port||u.search||u.hash||!['','/'].includes(u.pathname))throw Error('Use the HTTPS project URL from Supabase, ending in .supabase.co, with no extra path.');const key=value.key.trim();if(!/^sb_publishable_[A-Za-z0-9_-]{10,}$/.test(key))throw Error('Use the Publishable key (starts sb_publishable_). Never use a secret key, database password, or service_role key. Find the publishable key in Connect or Settings > API Keys.');return {url:u.origin,key};}
async function request(path,{method='GET',body,token,timeout=25000}={}){if(!config)throw Error('Connect your Supabase project first.');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const headers={apikey:config.key,'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const res=await fetch(config.url+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal,cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});const text=await res.text();let data;try{data=text?JSON.parse(text):null;}catch{data={message:text.slice(0,250)};}if(!res.ok){let msg=data?.msg||data?.message||data?.error_description||data?.error||`Connection returned ${res.status}`;if(/email address.*not authorized|email_address_not_authorized/i.test(msg))msg='Use the email address on your Supabase dashboard account. Its built-in email service only sends to project team addresses unless you configure custom SMTP.';if(/email.*rate limit|over_email_send_rate_limit/i.test(msg))msg='The email-sending limit was reached. Check for the confirmation email already sent instead of repeatedly signing up. Supabase controls the limit; custom SMTP is an option for ongoing delivery.';if(/plant_tracker_records|plant_tracker_sync|schema cache|permission denied for table/i.test(msg))msg='Database setup is missing or incomplete. Run the entire setup SQL in Supabase, then click Sync now. Details: '+msg;const error=Error(msg);error.status=res.status;throw error;}return data;}catch(e){if(e.name==='AbortError')throw Error('The connection timed out. Your changes are still saved on this device. Try Sync now after checking the project is running.');if(e instanceof TypeError)throw Error('Could not reach your Supabase project. Check your internet, project URL, and whether the project is paused. Local changes are safe.');throw e;}finally{clearTimeout(timer);}}
function normalizeSession(data){return {access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+(data.expires_in||3600)*1000,user:data.user,project:config.url};}
async function startSession(data){if(!data?.access_token||!data?.refresh_token)throw Error('Sign-in did not return a session. Confirm your email, then sign in.');const user=data.user||await request('/auth/v1/user',{token:data.access_token});if(!user?.id)throw Error('Could not verify the signed-in account.');const priorScope=scope,oldRows=Array.from(records.values()).map(clone);session=normalizeSession({...data,user});await writeMeta('session',session);await recordLock(async()=>{await loadScope(config.url+'|'+user.id);if(priorScope==='local'){const incoming=oldRows.filter(r=>!records.has(r.id)||Date.parse(r.client_updated_at)>Date.parse(records.get(r.id).client_updated_at)).map(r=>({...r,scope,dirty:true}));if(incoming.length){await writeRows(incoming);incoming.forEach(r=>records.set(r.id,r));}await deleteScope('local');}});syncError='';if(channel)channel.postMessage({type:'auth'});render();}
async function ensureSession(){if(!session)throw Error('Sign in to synchronize.');const shared=await readMeta('session');if(shared?.project===config.url&&shared?.user?.id===session.user?.id&&shared.expires_at>session.expires_at)session=shared;if(Date.now()<session.expires_at-90000)return session.access_token;const data=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}});session=normalizeSession({...data,user:data.user||session.user});await writeMeta('session',session);return session.access_token;}
function normalizedRemote(row){if(!row||!['plant','event','settings'].includes(row.kind)||typeof row.id!=='string'||!row.payload||typeof row.payload!=='object')throw Error('The cloud returned an invalid record. Export a backup and check your database.');return {scope,id:row.id,kind:row.kind,payload:row.payload,deleted:!!row.deleted,client_updated_at:new Date(row.client_updated_at).toISOString(),dirty:false};}
async function mergeRemote(rows,pushed=null){return recordLock(async()=>{const updates=[];for(const raw of rows){const r=normalizedRemote(raw),local=records.get(r.id);if(pushed){const sent=pushed.find(x=>x.id===r.id);if(local&&sent&&local.client_updated_at!==sent.client_updated_at)continue;}if(!local||Date.parse(r.client_updated_at)>Date.parse(local.client_updated_at)||(Date.parse(r.client_updated_at)===Date.parse(local.client_updated_at)&&(!local.dirty||pushed))){updates.push(r);}}if(updates.length){await writeRows(updates);updates.forEach(r=>records.set(r.id,r));}return updates.length;});}
async function syncCore(){if(!session||!config||syncBusy)return;if(!navigator.onLine){renderStatus();return;}syncBusy=true;syncError='';renderStatus();const activeScope=scope;let changed=false;try{const token=await ensureSession();let cursor=await readMeta('cursor:'+activeScope),offset=0,lastRemote=null;const after=cursor?new Date(Date.parse(cursor)-1000).toISOString():null;while(true){const path='/rest/v1/plant_tracker_records?select=*&user_id=eq.'+encodeURIComponent(session.user.id)+'&order=updated_at.asc,id.asc&limit=200&offset='+offset+(after?'&updated_at=gte.'+encodeURIComponent(after):'');const rows=await request(path,{token});if(scope!==activeScope)return;if(!Array.isArray(rows))throw Error('Unexpected response from the database.');if(rows.length){changed=!!(await mergeRemote(rows))||changed;lastRemote=rows[rows.length-1].updated_at;}if(rows.length<200)break;offset+=200;if(offset>50000)throw Error('This journal is too large for this version to sync safely. Export a backup.');}if(lastRemote)await writeMeta('cursor:'+activeScope,lastRemote);const pending=Array.from(records.values()).filter(r=>r.dirty).map(r=>({id:r.id,kind:r.kind,payload:r.payload,deleted:r.deleted,client_updated_at:r.client_updated_at}));for(let i=0;i<pending.length;i+=20){const batch=pending.slice(i,i+20);const rows=await request('/rest/v1/rpc/plant_tracker_sync',{method:'POST',body:{changes:batch},token});if(scope!==activeScope)return;if(!Array.isArray(rows))throw Error('Unexpected sync response. Run the supplied SQL to update the sync function.');await mergeRemote(rows,batch);changed=true;}lastSynced=new Date().toISOString();await writeMeta('lastSynced:'+activeScope,lastSynced);if(changed&&channel)channel.postMessage({type:'changed',scope});}catch(e){syncError=e.status===401?'Your session needs a fresh sign-in. Open Manage connection and sign in again. Unsynced changes remain on this device.':e.message;}finally{syncBusy=false;renderStatus();if(changed)rerenderSafe();const status=$('#connection-live');if(status){status.textContent=syncError||(lastSynced?'Up to date. Last sync '+timeLabel(lastSynced)+'.':'Ready to synchronize.');status.classList.toggle('error',!!syncError);}if(!syncError&&Array.from(records.values()).some(r=>r.dirty))scheduleSync();}}
async function syncNow(){if(!session)return;if(navigator.locks){await navigator.locks.request('tend-sync-'+DB_NAME,{ifAvailable:true},async lock=>{if(lock)await syncCore();});}else await syncCore();}

${!session?`<details ${config?'':'open'}><summary>1 &middot; Create your private database</summary><div class="instructions"><div class="step"><div><strong>Create a Supabase project</strong><p>Open <a href="https://supabase.com/dashboard" target="_blank" rel="noopener noreferrer">Supabase</a>, make an account, and create a project called <b>tend</b>. Save its database password in your password manager; it does not go into this app.</p></div></div><div class="step"><div><strong>Run the supplied setup</strong><p>In the project, open <b>SQL Editor &rarr; New query</b>. Copy the SQL below, paste it there, and select <b>Run</b>. This creates the table, owner-only access rules, and sync function.</p><div class="button-row"><button class="btn" data-action="copy-sql">Copy setup SQL</button><button class="btn soft" data-action="download-sql">Download SQL</button></div><details><summary>Show SQL for manual copying</summary><pre>${esc(SETUP_SQL)}</pre></details></div></div><div class="step"><div><strong>Set the email return address</strong><p>Open <b>Authentication &rarr; URL Configuration</b>. Set <b>Site URL</b> to your published GitHub Pages address (not the GitHub repository address). Add that exact address under <b>Redirect URLs</b> too. Keep email confirmation enabled.</p>${location.protocol!=='file:'?`<code>${esc(baseURL())}</code>`:'<p class="note">Publish your page before this step; a file:// address will not work for email confirmation.</p>'}</div></div></div></details><details ${config?'':'open'}><summary>2 &middot; Connect this browser</summary><form data-form="connection" style="margin-top:14px"><label class="field">Project URL<input type="url" name="url" required value="${esc(config?.url||'')}" placeholder="https://your-project.supabase.co" autocomplete="off"></label><label class="field">Publishable key<input name="key" required value="${esc(config?.key||'')}" placeholder="sb_publishable_..." autocomplete="off" spellcheck="false"><small>Find these in your project's <b>Connect</b> dialog; the key is also in <b>Settings &rarr; API Keys</b>. Only the Publishable key is accepted. Never paste a secret key.</small></label><button class="btn primary" type="submit">Save connection</button></form></details><details ${config?'open':''}><summary>3 &middot; Create your plant login, or sign in</summary><p class="note">This is your Tend login, separate from your Supabase dashboard login. For first setup, use the email address of your Supabase dashboard account: the built-in email sender only reaches project team addresses. Use the same Tend account on both devices. Existing local records merge into it on first connection.</p>${authForm()}</details>`:''}

function openHelp(){showModal('A little help getting started.',`<div class="hint">${icon('leaf')}<div><strong>Everything starts with index.html.</strong><p>No command line, npm, or code editing required. The app saves locally until you turn on synchronization.</p></div></div><div class="help-grid" style="margin-top:24px"><section><h3>1. Put it on GitHub</h3><div class="instructions"><div class="step"><div><strong>Create a repository</strong><p>On GitHub, select <b>+ &rarr; New repository</b>. Name it <b>plant-tracker</b>, choose <b>Public</b>, and enable <b>Add a README</b>. Create it.</p></div></div><div class="step"><div><strong>Upload only the app</strong><p>In the repository, choose <b>Add file &rarr; Upload files</b>. Upload <b>index.html</b> without putting it inside a folder. Select <b>Commit changes</b>.</p></div></div><div class="step"><div><strong>Turn on Pages</strong><p>Repository <b>Settings &rarr; Pages &rarr; Deploy from a branch</b>. Select <b>main</b> and <b>/ (root)</b>, then <b>Save</b>. Open the website address shown there after deployment completes.</p></div></div></div><p class="note">The app page is public. Never upload your backups, personal photos, database passwords, or secret keys to this repository.</p></section><section><h3>2. Share one journal</h3><p class="body-copy" style="margin-top:15px">Use <b>Settings &rarr; Set up synchronization</b>. The guided panel provides the SQL and the three setup steps. You will create your own Supabase project and plant login.</p><div class="button-row"><button class="btn primary" data-action="connection">Open sync setup</button></div><p class="note">For phone access, send yourself the connection link after signing in. Bookmark the page or use your browser's Add to Home Screen option. This file is a bookmarkable web app, not a fully offline-installable PWA.</p><p class="note">Logging works in an already open tab when offline. Reopening or refreshing a hosted page may need internet. Queued changes sync when connectivity returns.</p></section></div><hr class="rule"><h3>Everyday shortcuts</h3><p class="body-copy" style="margin-top:12px"><b>Watered now:</b> one tap, with a 12-second Undo. <b>Check soil:</b> tap Wet, Damp, Dry, or Not sure. <b>+ Add entry:</b> past watering dates, fertilizer, health photos, notes, or repotting. <b>Profile &amp; care:</b> pot, light, cover photo, and care settings.</p><hr class="rule"><h3>What recommendations do and do not mean</h3><p class="body-copy" style="margin-top:12px">Reminders suggest checking, not watering. An initial editable interval is adjusted modestly for calendar season and your reported light. After three suitable water-to-dry observations, the app can suggest an earlier check based on their median. This is a transparent heuristic, not a validated plant-health model. Soil mix, pot details, and grow-light hours are recorded for context; they are not turned into unsupported quantitative predictions.</p><p class="body-copy" style="margin-top:12px">Only observations since the last growing-condition change, in comparable light / seasonal settings, contribute to learning. An observed dry day is an upper bound on when the mix dried, not a precise drying measurement. Large-pot and unidentified-plant prompts stay cautious. Photos are for your journal; there is no automatic identification or diagnosis.</p><div class="source-list" style="margin-top:16px"><a href="https://homegarden.cahnr.uconn.edu/factsheets/monstera-deliciosa/" target="_blank" rel="noopener noreferrer">UConn Extension - Monstera deliciosa care</a><a href="https://extension.illinois.edu/houseplants/pothos" target="_blank" rel="noopener noreferrer">Illinois Extension - Golden pothos care</a><a href="https://extension.illinois.edu/houseplants/watering" target="_blank" rel="noopener noreferrer">Illinois Extension - Watering houseplants</a><a href="https://extension.illinois.edu/houseplants/care" target="_blank" rel="noopener noreferrer">Illinois Extension - Feeding during active growth</a><a href="https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site" target="_blank" rel="noopener noreferrer">GitHub - Publishing a Pages site</a><a href="https://supabase.com/docs/guides/getting-started/api-keys" target="_blank" rel="noopener noreferrer">Supabase - Publishable keys and security</a><a href="https://supabase.com/docs/guides/auth/auth-smtp" target="_blank" rel="noopener noreferrer">Supabase - Built-in email restrictions</a></div><hr class="rule"><h3>Privacy, backups, and conflicts</h3><p class="body-copy" style="margin-top:12px">Photos are resized into the journal database, not a public photo bucket. Backups contain personal records but no credentials. Sign-in tokens stay in this browser's storage. Sign out on shared devices. Clearing browser storage can erase unsynced entries, so export first.</p><p class="body-copy" style="margin-top:12px">Different entries merge across devices. Edits to the exact same entry, profile, or settings record use the latest device timestamp, not field-by-field merging. Keep device clocks correct and avoid editing the same profile simultaneously. Deleted entries remain as empty synchronization tombstones; backups you already downloaded do not change. Supabase administrators (you) can manage account deletion in the dashboard.</p><p class="note">Built as a dependency-free single HTML file. No push service, weather API, photo AI, or tracking analytics. Care-source and setup documentation reviewed November 17, 2026.</p>`,true);}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;}}catch{}const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';($('#modal').open?$('#modal-body'):document.body).appendChild(ta);ta.select();let success=false;try{success=document.execCommand('copy');}catch{}ta.remove();return success;}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function exportBackup(){const list=Array.from(records.values()).map(({id,kind,payload,deleted,client_updated_at})=>({id,kind,payload,deleted,client_updated_at}));download('tend-backup-'+dateKey()+'.json',JSON.stringify({app:'Tend',version:VERSION,exportedAt:new Date().toISOString(),home:'Portland, Oregon',records:list},null,2),'application/json');await writeMeta('lastBackup:'+scope,new Date().toISOString());toast('Backup downloaded. Keep it private, outside your GitHub repository.');}

function exportCSV(){const rows=[['Plant','Care type','Date (Portland)','Time (Portland)','Timestamp UTC','Observation / details','Notes']];events().forEach(e=>rows.push([plant(e.plantId)?.name||e.plantId,EVENT_LABELS[e.type],dateKey(e.at),timeLabel(e.at),e.at,eventDetail(e),e.notes||'']));download('tend-history-'+dateKey()+'.csv','\uFEFF'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('History CSV downloaded. Photos are in the full JSON backup.');}
function validateImport(data){if(!data||data.app!=='Tend'||data.version!==VERSION||!Array.isArray(data.records)||data.records.length>20000)throw Error('Choose a Tend version 1 JSON backup, with at most 20,000 records.');const seen=new Set();return data.records.map(r=>{if(!r||typeof r.id!=='string'||!/^[A-Za-z0-9-]{1,100}$/.test(r.id)||seen.has(r.id)||!['plant','event','settings'].includes(r.kind)||!r.payload||Array.isArray(r.payload)||typeof r.payload!=='object'||!Number.isFinite(Date.parse(r.client_updated_at)))throw Error('The backup contains an invalid or duplicate record. Nothing was imported.');seen.add(r.id);if(JSON.stringify(r.payload).length>1800000)throw Error('One photo or record is too large. Nothing was imported.');const p=r.payload;const textFields=['name','customSpecies','location','soil','notes','photo','fertProduct','fertDose','amount','method','depth','product','dose','observation','caretaker','start','end'];if(textFields.some(k=>p[k]!==undefined&&typeof p[k]!=='string'))throw Error('A text field in the backup has an invalid value. Nothing was imported.');if(p.photo&&!safePhoto(p.photo))throw Error('A photo in this backup has an unsupported format. Nothing was imported.');if(!r.deleted){if(r.kind==='plant'&&(typeof p.name!=='string'||p.name.length>100||!Object.hasOwn(SPECIES,p.type)))throw Error('An invalid plant profile was found.');if(r.kind==='event'&&(!Object.hasOwn(EVENT_LABELS,p.type)||typeof p.plantId!=='string'||typeof p.at!=='string'||!Number.isFinite(Date.parse(p.at))||Date.parse(p.at)>Date.now()+300000||(p.type==='moisture'&&!['wet','damp','dry','uncertain'].includes(p.moisture))))throw Error('An invalid or future-dated event was found.');if(r.kind==='settings'&&!['home','vacation'].includes(r.id))throw Error('Unknown settings in this backup.');if(r.kind==='settings'&&r.id==='home'&&(!['verylow','low','medium','bright','grow'].includes(p.light)||!['auto','low','growing'].includes(p.seasonMode)))throw Error('Invalid home settings in this backup.');if(r.kind==='settings'&&r.id==='vacation'&&p.enabled&&(!/^\d{4}-\d\d-\d\d$/.test(p.start)||!/^\d{4}-\d\d-\d\d$/.test(p.end)||!Number.isFinite(Date.parse(p.start))||!Number.isFinite(Date.parse(p.end))||p.end<p.start))throw Error('Invalid vacation dates in this backup.');}return {id:r.id,kind:r.kind,payload:clone(p),deleted:!!r.deleted,client_updated_at:new Date(r.client_updated_at).toISOString()};});}
async function importBackup(file){if(!file)return;if(file.size>50*1024*1024)throw Error('This backup is larger than 50 MB. It was not imported.');const rows=validateImport(JSON.parse(await file.text()));const newer=rows.filter(r=>!records.has(r.id)||Date.parse(r.client_updated_at)>Date.parse(records.get(r.id).client_updated_at));if(!newer.length){toast('No newer or missing records found. Nothing changed.');return;}if(!confirm(`Merge ${newer.length} missing or newer records from this backup? Existing records newer than the backup are kept. Imported changes will sync to your account.`))return;await commit(newer.map(({id,kind,payload,deleted})=>({id,kind,payload,deleted})),{message:`Imported ${newer.length} records.`});}
async function photoData(file){if(!file)return '';if(file.size>15*1024*1024)throw Error('Choose a photo smaller than 15 MB.');if(!file.type.startsWith('image/'))throw Error('Choose an image file.');const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('This browser cannot open that image. Try a JPEG, PNG, or WebP photo.'));im.src=url;});const scale=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#f5f5ef';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let photo=canvas.toDataURL('image/jpeg',.8);if(photo.length>700000)photo=canvas.toDataURL('image/jpeg',.6);if(photo.length>1400000)throw Error('This photo is still too large after resizing. Try a smaller image.');return photo;}finally{URL.revokeObjectURL(url);}}
function icsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function foldICS(line){let out='',chunk='',bytes=0;for(const char of line){const len=new TextEncoder().encode(char).length;if(bytes+len>72){out+=chunk+'\r\n ';chunk='';bytes=1;}chunk+=char;bytes+=len;}return out+chunk;}
