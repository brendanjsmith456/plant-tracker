 case 'home':{const old=home(),next={...old,light:get('light'),seasonMode:get('seasonMode')},changed=old.light!==next.light||old.seasonMode!==next.seasonMode;const changes=[{id:'home',kind:'settings',payload:next}];if(changed)allPlants(true).filter(p=>p.light==='inherit'||old.seasonMode!==next.seasonMode).forEach(p=>{const {id,...payload}=p;changes.push({id,kind:'plant',payload:{...payload,resetAt:new Date().toISOString()}});});await commit(changes,{message:'Home settings saved. Your history is unchanged.'});break;}
 case 'plant':{if(!context||context.kind!=='plant')return;const old=plant(context.id);const payload={...(old||defaultPlant(context.id,'other','',allPlants(true).length+1).payload),name:get('name'),type:get('type'),customSpecies:get('customSpecies'),location:get('location'),light:get('light'),potSize:get('potSize'),material:get('material'),drainage:get('drainage'),baseDays:clamp(Number(get('baseDays')),1,30),soil:get('soil'),growth:get('growth'),growHours:clamp(Number(get('growHours'))||12,1,24),notes:get('notes'),photo:context.photo||'',fertilizerEnabled:f.has('fertilizerEnabled'),fertDays:clamp(Number(get('fertDays'))||30,1,365),fertProduct:get('fertProduct'),fertDose:get('fertDose')};delete payload.id;if(!payload.name)throw Error('Give the plant a name.');if(old&&['type','location','light','potSize','material','drainage','soil','growHours','baseDays','growth'].some(k=>old[k]!==payload[k]))payload.resetAt=new Date().toISOString();await commit([{id:context.id,kind:'plant',payload}],{message:old?'Profile saved.':'Plant added.'});closeModal();break;}
 case 'event':{if(!context||context.kind!=='event')return;const type=get('type'),id=context.original?.plantId||get('plantId'),p=plant(id);if(!p)throw Error('Choose a plant.');const at=fromLocalInput(get('at'));const payload={plantId:id,type,at,notes:get('notes'),photo:context.photo||'',environment:context.original?.environment||environment(p,new Date(at))};if(['water','water_fertilize'].includes(type)){payload.amount=get('amount');payload.method=get('waterMethod');}if(type==='moisture'){payload.moisture=get('moisture');payload.depth=get('depth');}if(['fertilize','water_fertilize'].includes(type)){payload.product=get('product');payload.dose=get('dose');}if(type==='health')payload.observation=get('observation');if(type==='snooze'){if(!get('until'))throw Error('Choose the snooze date.');payload.until=dateOnlyISO(get('until'));}const changes=[];if(type==='repot'){Object.assign(payload,{potSize:get('potSize'),soil:get('soil'),material:get('material'),drainage:get('drainage')});if(f.has('updateProfile')){const {id:pid,...profile}=p;changes.push({id:pid,kind:'plant',payload:{...profile,potSize:payload.potSize,soil:payload.soil,material:payload.material,drainage:payload.drainage,resetAt:at}});}}changes.push({id:context.id,kind:'event',payload});await commit(changes,{undo:true,message:context.existing?'Entry updated.':'Care recorded.'});closeModal();break;}
 case 'vacation':{const start=get('start'),end=get('end');if(!start||!end||end<start)throw Error('The return date must be on or after departure.');await commit([{id:'vacation',kind:'settings',payload:{enabled:f.has('enabled'),start,end,caretaker:get('caretaker'),notes:get('notes')}}],{message:'Vacation plan saved.'});closeModal();break;}
 case 'calendar':{const days=clamp(Number(get('reminderDays')),1,30),hour=clamp(Number(get('reminderHour')),0,23);await commit([{id:'home',kind:'settings',payload:{...home(),reminderDays:days,reminderHour:hour}}],{message:''});calendarFile(days,hour);toast('Calendar file downloaded. Import it into your calendar to enable its reminders.');break;}
 case 'connection':{if(session)throw Error('Sign out before changing projects.');config=validateConfig({url:get('url'),key:get('key')});await writeMeta('config',config);openConnection();renderStatus();toast('Connection saved. Next, create your plant account or sign in.');break;}
 case 'auth':{if(authWorking)return;if(!config)throw Error('Save your project URL and publishable key in step 2 first.');const mode=event.submitter?.value||'login',email=get('email'),password=String(f.get('password')||'');if(password.length<8)throw Error('Use at least 8 characters for your plant-account password.');if(location.protocol==='file:'&&mode==='signup')throw Error('Publish the page first, then create your plant account on the hosted website so email confirmation can return there.');authWorking=true;form.querySelectorAll('button').forEach(b=>b.disabled=true);const msg=$('#auth-message');if(msg)msg.textContent=mode==='signup'?'Creating your plant account...':'Signing in...';try{const path=mode==='signup'?'/auth/v1/signup?redirect_to='+encodeURIComponent(baseURL()):'/auth/v1/token?grant_type=password';const data=await request(path,{method:'POST',body:{email,password}});form.elements.password.value='';if(data?.access_token){await startSession(data);openConnection();await syncNow();toast(syncError?'Signed in. Open connection details to finish database setup.':'Signed in. Your plant journal is connected.');}else{if(msg){msg.textContent='Check your email and click the confirmation link. Then return here and sign in. If no email arrives, check spam or try signing in to an existing account. Keep this project connection saved.';msg.classList.remove('inline-error');}}}catch(e){if(msg){msg.textContent=e.message;msg.classList.add('inline-error');}throw e;}finally{authWorking=false;form.querySelectorAll('button').forEach(b=>b.disabled=false);}break;}
 case 'password':{if(!session)throw Error('Open the password-reset email link first.');const password=String(f.get('password')||'');if(password.length<8)throw Error('Use at least 8 characters.');const token=await ensureSession();await request('/auth/v1/user',{method:'PUT',body:{password},token});closeModal();toast('Password updated. Use the new password on your other device.');break;}
}}
const waterBusy=new Set();
async function handleAction(action,el){const id=el.dataset.id;switch(action){
 case 'nav':tab=el.dataset.tab;closeModal();render();window.scrollTo({top:0,behavior:'instant'});if(tab==='settings'){const last=await readMeta('lastBackup:'+scope);if(last&&$('#backup-info'))$('#backup-info').textContent='Last exported '+dateLabel(last,true)+' at '+timeLabel(last)+'.';}break;
 case 'close':closeModal();break;
 case 'dismiss-toast':clearTimeout(toastTimer);$('#toast-wrap').innerHTML='';undoAction=null;break;
 case 'undo':{const fn=undoAction;undoAction=null;if(fn)await fn();else toast('The undo window has closed. Edit the entry in your journal.');break;}
 case 'water':{if(waterBusy.has(id))return;const p=plant(id);if(!p)return;waterBusy.add(id);try{const last=waters(id)[0];if(last&&Date.now()-Date.parse(last.at)<60000){toast('Already logged in the last minute. Edit that entry in your journal if needed.');return;}await saveEvent({plantId:id,type:'water',at:new Date().toISOString(),environment:environment(p)},{message:p.name+' watered. Saved.',undo:true});}finally{setTimeout(()=>waterBusy.delete(id),650);}break;}
 case 'soil':openSoil(id);break;
 case 'save-soil':{const p=plant(id);if(!p)return;const depth=$('#soil-depth')?.value?.trim()||'',notes=$('#soil-note')?.value?.trim()||'';el.disabled=true;await saveEvent({plantId:id,type:'moisture',moisture:el.dataset.value,depth,notes,at:new Date().toISOString(),environment:environment(p)},{message:`${p.name}: ${el.dataset.value==='uncertain'?'not sure':el.dataset.value} recorded.`,undo:true});closeModal();break;}
 case 'why':openWhy(id);break;
 case 'profile':openProfile(id);break;
 case 'add-plant':plantForm();break;
 case 'edit-plant':plantForm(id);break;
 case 'event':eventForm(id);break;
 case 'edit-event':{const e=events().find(x=>x.id===id);if(e)eventForm(e.plantId,id);break;}
 case 'delete-event':{if(!confirm('Delete this care entry? This deletion will sync to your other device.'))return;const r=records.get(id);await commit([{id,kind:'event',payload:{},deleted:true}],{undo:true,message:'Entry deleted.'});closeModal();break;}
 case 'plant-history':historyPlant=id;historyDay='';historyType='';tab='history';closeModal();render();window.scrollTo({top:0,behavior:'instant'});break;
 case 'snooze':showModal('Check again a little later.',`<p class="body-copy">Snoozing changes only the reminder. No watering or soil observation is added.</p><div class="button-row">${[1,2,3,7].map(n=>`<button class="btn" data-action="set-snooze" data-id="${id}" data-days="${n}">${n} day${n===1?'':'s'}</button>`).join('')}</div>`);break;
 case 'set-snooze':await saveEvent({plantId:id,type:'snooze',at:new Date().toISOString(),until:new Date(Date.now()+Number(el.dataset.days)*DAY).toISOString()},{undo:true,message:'Check reminder snoozed.'});closeModal();break;
 case 'archive-plant':{const p=plant(id);if(!confirm('Archive '+p.name+'? Its full history stays in your journal, and you can restore it in Settings.'))return;const {id:pid,...payload}=p;await commit([{id:pid,kind:'plant',payload:{...payload,archived:true}}],{undo:true,message:'Plant archived. History preserved.'});closeModal();break;}
 case 'restore-plant':{const {id:pid,...payload}=plant(id);await commit([{id:pid,kind:'plant',payload:{...payload,archived:false}}],{message:'Plant restored.'});break;}
 case 'remove-photo':if(modalContext){modalContext.photo='';const preview=$('#plant-photo-preview')||$('#event-photo-preview');if(preview)preview.innerHTML='';}break;
 case 'photo':{const e=events().find(x=>x.id===id);if(e&&safePhoto(e.photo))showModal('Journal photo',`<img src="${safePhoto(e.photo)}" alt="${esc(e.observation||'Plant photo')}" style="max-width:100%;border-radius:12px"><p class="note">${esc(dateLabel(e.at,true))}${e.notes?' - '+esc(e.notes):''}</p>`);break;}
 case 'month':{const [y,m]=monthCursor.split('-').map(Number);const next=new Date(Date.UTC(y,m-1+Number(el.dataset.step),1));monthCursor=next.toISOString().slice(0,7);historyDay='';render();break;}
 case 'history-day':historyDay=historyDay===el.dataset.day?'':el.dataset.day;historyLimit=100;render();break;
 case 'clear-day':historyDay='';render();break;
 case 'more-history':historyLimit+=100;render();break;
 case 'vacation':openVacation();break;
 case 'caretaker':showCaretaker();break;
 case 'print-care':$('#print-area').innerHTML=caretakerMarkup();window.print();break;
 case 'download-care':download('tend-caretaker-'+dateKey()+'.html','<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tend - caretaker handoff</title><style>body{max-width:800px;margin:30px auto;padding:0 22px;font:15px/1.6 system-ui,sans-serif;color:#294b3e}h1,h2{font-family:Georgia,serif;font-weight:normal}.hint{background:#edf0e5;padding:16px;border-radius:10px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px}.care-card p{margin:8px 0}@media print{.care-card{break-inside:avoid}}</style><body>'+caretakerMarkup()+'</body></html>','text/html;charset=utf-8');toast('Caretaker handoff downloaded. It is a dated snapshot, not a live journal.');break;
 case 'help':openHelp();break;
 case 'connection':openConnection();break;
 case 'sync':if(!session){openConnection();break;}await syncNow();toast(syncError||'Synchronization checked.',!!syncError);break;
 case 'copy-sql':if(await copyText(SETUP_SQL))toast('Setup SQL copied. Paste it into Supabase SQL Editor and click Run.');else toast('Clipboard unavailable. Expand Show SQL, then select and copy it manually.',true);break;
 case 'download-sql':download('tend-setup.sql',SETUP_SQL);toast('Setup SQL downloaded. Open it in a text editor and paste it into Supabase SQL Editor.');break;
 case 'connection-link':{const link=connectionLink();showModal('Open the same journal on your phone.',`<p class="body-copy">Send yourself this link, open it on your phone, then sign in with your existing Tend email and password.</p><label class="field">Device setup link<textarea readonly id="phone-link" style="min-height:115px">${esc(link)}</textarea></label><button class="btn primary" data-action="copy-phone-link">Copy link</button><p class="note">This link contains the project address and publishable key only. It cannot sign in for you, and it contains no personal plant records or password.</p>`);break;}
 case 'copy-phone-link':if(await copyText($('#phone-link').value))toast('Phone setup link copied.');else{$('#phone-link').select();toast('Select and copy the link above.');}break;
 case 'forgot-password':{if(!config)throw Error('Save your project connection first.');const email=$('#modal-body input[name=email]')?.value?.trim();if(!email)throw Error('Enter your email above first.');if(location.protocol==='file:')throw Error('Open the published website before requesting a reset link.');await request('/auth/v1/recover?redirect_to='+encodeURIComponent(baseURL()),{method:'POST',body:{email}});toast('Check your email for a password-reset link.');break;}
 case 'sign-out':{if(syncBusy)throw Error('Synchronization is active. Try signing out after its status changes.');const pending=Array.from(records.values()).filter(r=>r.dirty&&r.client_updated_at!==EPOCH).length;if(pending)throw Error('There are unsynced changes. Sync them first, or export a backup before clearing this browser.');if(!confirm('Sign out and remove this account\'s cached records from this browser? Cloud records remain. Other devices stay signed in.'))return;const oldScope=scope;try{await request('/auth/v1/logout?scope=local',{method:'POST',token:session.access_token});}catch{/* Removing local credentials still signs this browser out. */}session=null;await writeMeta('session',null);await recordLock(async()=>{await deleteScope(oldScope);await writeMeta('cursor:'+oldScope,null);await writeMeta('lastSynced:'+oldScope,null);await loadScope('local');});syncError='';if(channel)channel.postMessage({type:'auth'});closeModal();render();toast('Signed out on this device. Cloud history is unchanged.');break;}
 case 'export':await exportBackup();break;
 case 'import':$('#import-file').click();break;
 case 'csv':exportCSV();break;
}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;event.preventDefault();if(el.disabled)return;handleAction(el.dataset.action,el).catch(e=>{console.warn('Tend action failed:',e.message);toast(e.message||'That action could not be completed.',true);});});
document.addEventListener('submit',async event=>{const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();if(form.dataset.busy==='true')return;form.dataset.busy='true';const buttons=Array.from(form.querySelectorAll('button[type=submit]'));buttons.forEach(b=>b.disabled=true);try{await handleSubmit(form,event);}catch(e){console.warn('Tend form failed:',e.message);toast(e.message||'Could not save. Your form has not been cleared.',true);}finally{form.dataset.busy='false';buttons.forEach(b=>b.disabled=false);}});
document.addEventListener('change',async event=>{const el=event.target;try{switch(el.dataset.change){case 'history-plant':historyPlant=el.value;historyLimit=100;render();break;case 'history-type':historyType=el.value;historyLimit=100;render();break;case 'event-type':toggleEventFields(el.value);break;case 'species':{const input=$('#plant-form input[name=baseDays]');if(input)input.value=SPECIES[el.value].base;break;}case 'plant-photo':case 'event-photo':{const current=modalContext;if(!current)return;const buttons=Array.from($('#modal-body').querySelectorAll('button[type=submit]'));buttons.forEach(b=>b.disabled=true);try{const photo=await photoData(el.files[0]);if(modalContext===current){modalContext.photo=photo;const preview=$('#plant-photo-preview')||$('#event-photo-preview');if(preview)preview.innerHTML=photo?`<img class="photo-preview" src="${photo}" alt="Photo preview">`:'';}}finally{buttons.forEach(b=>b.disabled=false);}break;}}if(el.id==='import-file'){await importBackup(el.files[0]);el.value='';}}catch(e){toast(e.message,true);if(el.id==='import-file')el.value='';}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('img[data-action=photo]')){e.preventDefault();handleAction('photo',e.target).catch(x=>toast(x.message,true));}});
$('#modal').addEventListener('close',()=>{document.body.style.overflow='';modalContext=null;});
$('#modal').addEventListener('click',e=>{if(e.target!==$('#modal'))return;const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();});
async function handleHash(){if(!location.hash)return;const params=new URLSearchParams(location.hash.slice(1));if(params.has('connect')){try{const candidate=validateConfig(JSON.parse(atob(params.get('connect'))));if(session&&config?.url!==candidate.url)throw Error('Sign out before connecting a different project.');if(!config||config.url!==candidate.url||config.key!==candidate.key){if(!confirm('Connect this browser to the Supabase project '+new URL(candidate.url).hostname+'? Only accept setup links you created yourself.'))return;config=candidate;await writeMeta('config',config);}history.replaceState(null,'',location.pathname+location.search);openConnection();toast('Project connection loaded. Sign in with your existing plant account.');}catch(e){history.replaceState(null,'',location.pathname+location.search);throw e;}return;}if(params.has('error_description')){history.replaceState(null,'',location.pathname+location.search);throw Error(params.get('error_description'));}if(params.has('access_token')){const data={access_token:params.get('access_token'),refresh_token:params.get('refresh_token'),expires_in:Number(params.get('expires_in'))||3600};const type=params.get('type');history.replaceState(null,'',location.pathname+location.search);if(!config){toast('Email link received. Load your project connection, then sign in. For a password reset, request a new link after connecting.',true);openConnection();return;}await startSession(data);if(type==='recovery'){modalContext={kind:'password'};showModal('Choose a new plant-account password.',`<form data-form="password"><label class="field">New password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="btn primary" type="submit">Update password</button></form>`);}else{openConnection();toast('Email confirmed. You are signed in.');}await syncNow();}}
async function refreshFromStorage(){if(!storageReady||authWorking)return;await recordLock(async()=>{const saved=await readMeta('session');const nextConfig=await readMeta('config');if(nextConfig)config=nextConfig;const nextScope=saved?.user?.id&&saved.project===config?.url?config.url+'|'+saved.user.id:'local';if(nextScope!==scope){session=saved;await loadScope(nextScope);}else{session=saved||null;const rows=await readScope(scope);records=new Map(rows.map(r=>[r.id,r]));lastSynced=await readMeta('lastSynced:'+scope);}});rerenderSafe();}
async function initialize(){fillIcons();try{db=await openDB();config=await readMeta('config');if(config)config=validateConfig(config);session=await readMeta('session');if(session?.project!==config?.url)session=null;await loadScope(session?.user?.id?config.url+'|'+session.user.id:'local');storageReady=true;render();if('BroadcastChannel' in window){channel=new BroadcastChannel(DB_NAME);channel.onmessage=event=>{if(event.data.type==='auth'||event.data.scope===scope)refreshFromStorage().catch(e=>toast(e.message,true));};}await handleHash();if(session)await syncNow();const lastBackup=await readMeta('lastBackup:'+scope),count=events().length;if(count>3&&(!lastBackup||Date.now()-Date.parse(lastBackup)>14*DAY))toast('A spare copy is a good idea. Export your journal from Settings.');}catch(e){if(!storageReady){$('#app').innerHTML=`<div class="panel"><h2>We could not open local storage.</h2><p class="body-copy" style="margin-top:16px">${esc(e.message)} Try a regular Chrome tab rather than private browsing, and allow site storage. Do not clear existing storage before exporting any saved journal.</p><p class="note">No care records have been marked as saved.</p><button class="btn" onclick="location.reload()" style="margin-top:18px">Try again</button></div>`;}else toast(e.message,true);}}
window.addEventListener('online',()=>{syncNow().catch(e=>toast(e.message,true));});
window.addEventListener('offline',renderStatus);
window.addEventListener('hashchange',()=>handleHash().catch(e=>toast(e.message,true)));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFromStorage().then(()=>syncNow()).catch(e=>toast(e.message,true));});
setInterval(()=>{if(!storageReady||document.hidden)return;const now=dateKey();if(now!==lastDate){lastDate=now;rerenderSafe();}if(session)syncNow().catch(e=>{syncError=e.message;renderStatus();});},30000);
window.addEventListener('beforeunload',()=>{if(channel)channel.close();});
initialize();
